[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = strict
# Every async fixture and every async test shares ONE session-scoped event
# loop. This keeps the SQLAlchemy engine / aiosqlite connection pool bound to
# a single loop, so no connection is ever reused across two different loops.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

filterwarnings =
    ignore::DeprecationWarning
