AutoName: SelfTrack
Summary: Privacy-first all-in-one habits, health, journal & AI companion.
Description: |-
  SelfTrack is an open-source, privacy-first personal growth companion designed
  to help you build lasting habits, track daily health metrics, reflect deeply
  through journaling, and optimize focus.

  Features:
  * Habit tracking with fractional consistency rings and streaks
  * Step counter, hydration tracker, and meal energy logging
  * Menstrual cycle and symptom forecasting
  * Daily reflections and mood journaling
  * Pomodoro focus timer with offline ambient soundscapes
  * XP gamification, achievements, and milestone badges
  * Completely offline-first with zero tracking or telemetry

